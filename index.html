<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taco Uno+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --magenta:#E5177E; --chile:#E63946; --teal:#00A9B4; --green:#7CB342;
    --cream:#F5EFE6; --muted:#8A8377; --line:#2A2823;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{max-width:360px; width:100%; text-align:center;}
  .logo-slot{
    width:96px; height:96px; margin:0 auto 22px; border-radius:50%;
    border:2px solid var(--teal); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:.78rem; letter-spacing:.5px; overflow:hidden; background:#fff;
  }
  .logo-slot img{width:100%; height:100%; object-fit:cover;}
  h1{
    font-family:'Baloo 2',sans-serif; font-size:2.4rem; font-weight:800; margin:0 0 8px; color:var(--magenta);
  }
  p.sub{color:var(--muted); margin:0 0 34px; font-size:.98rem;}
  .actions{display:flex; flex-direction:column; gap:12px;}
  a.btn{
    display:block; text-decoration:none; padding:15px; border-radius:12px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.05rem;
  }
  .btn-primary{background:var(--chile); color:var(--cream);}
  .btn-primary:active{background:#c92836;}
  .btn-secondary{background:transparent; color:var(--teal); border:1px solid var(--teal);}
  .btn-secondary:active{background:#0f2a2c;}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#141312; }
  }
</style>
</head>
