<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guisados - Taco Uno+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --card:#1E1D1A; --card2:#262420; --line:#2E2C27;
    --chile:#E63946; --magenta:#E5177E; --teal:#00A9B4; --green:#7CB342;
    --cream:#F5EFE6; --muted:#A69C8C;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; padding-bottom:130px;}
  h1,h2,.price,.qty-count{font-family:'Baloo 2',sans-serif;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
  }
  .topbar a{
    color:var(--teal); text-decoration:none; font-size:.9rem; font-weight:600;
    border:1px solid var(--line); padding:8px 14px; border-radius:9px;
  }
  .topbar-brand{display:flex; align-items:center; gap:9px;}
  .topbar-brand img{width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--teal);}
  .topbar h1{font-size:1.2rem; margin:0; color:var(--magenta);}

  main{max-width:640px; margin:0 auto; padding:20px 16px;}

  .taco{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; display:flex; gap:14px; align-items:center;
  }
  .photo-slot{
    width:88px; height:88px; flex-shrink:0; border-radius:12px;
    border:2px dashed var(--teal); position:relative; overflow:hidden;
  }
  .photo-slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-fallback{
    display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    width:100%; height:100%; color:var(--muted); font-size:.62rem; text-align:center; line-height:1.2;
  }
  .photo-fallback .icon{font-size:1.4rem;}

  .taco-info{flex:1; min-width:0;}
  .taco-info h2{font-size:1.1rem; margin:0 0 3px; font-weight:700;}
  .taco-info p{margin:0; color:var(--muted); font-size:.85rem; line-height:1.35;}
  .price{color:var(--magenta); font-weight:700; font-size:.92rem; margin-top:5px; display:block;}

  .stepper{display:flex; align-items:center; gap:9px; flex-shrink:0;}
  .stepper button{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background:var(--card2); color:var(--cream); font-size:1.15rem; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .stepper button:active{background:var(--chile); border-color:var(--chile);}
  .qty-count{min-width:16px; text-align:center; font-weight:700;}

  #pedido{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin:20px 0 12px; scroll-margin-top:20px;
  }
  #pedido h2{font-size:1.05rem; margin:0 0 10px;}
  #pedido label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:8px;}
  #pedido input{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--card2); color:var(--cream); font-size:1rem; font-family:inherit;
  }
  #pedido input:focus{outline:2px solid var(--teal); outline-offset:1px;}

  .bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .bar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:14px;}
  .bar-total{flex:1;}
  .bar-total span{display:block; color:var(--muted); font-size:.78rem;}
  .bar-total strong{font-size:1.35rem; color:var(--magenta);}
  .order-btn{
    background:var(--chile); color:var(--cream); border:none; border-radius:11px;
    padding:14px 20px; font-size:.98rem; font-weight:700; font-family:'Baloo 2',sans-serif;
    cursor:pointer; white-space:nowrap;
  }
  .order-btn:disabled{background:var(--card2); color:var(--muted); cursor:not-allowed;}
  .order-btn:not(:disabled):active{background:#c92836;}
  .hint{font-size:.76rem; color:var(--muted); text-align:center; margin-top:4px;}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#FBF8F2; --card:#FFFFFF; --card2:#F2EDE2; --line:#E4DCC9;
      --cream:#2A241C; --muted:#7A7062;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← Inicio</a>
  <div class="topbar-brand">
    <img src="logo.png" alt="Taco Uno+" onerror="this.style.display='none';">
    <h1>Guisados</h1>
  </div>
  <span style="width:70px"></span>
</div>

<main>
  <div id="menu"></div>

  <div id="pedido">
    <h2>Tu pedido</h2>
    <label for="nombre">Tu nombre</label>
    <input type="text" id="nombre" placeholder="¿Cómo te llamas?">
  </div>
</main>

<div class="bar">
  <div class="bar-inner">
    <div class="bar-total">
      <span id="itemsLabel">0 tacos</span>
      <strong id="totalLabel">$0</strong>
    </div>
    <button class="order-btn" id="orderBtn" disabled>Hacer Pedido</button>
  </div>
  <p class="hint" id="hintText">Agrega al menos un taco y escribe tu nombre</p>
</div>

<script>
const WHATSAPP_NUMBER = "529831022379";

const tacos = [
  {id:1, name:"Tortita de Camarón con Nopales", desc:"Tortita de camarón guisada con nopales", price:19, image:"TORTITA_DE_CAMARON_CON_NOPALES-1.jpeg"},
  {id:2, name:"Coliflor Capeada", desc:"Coliflor capeada en huevo, con arroz y frijol", price:16, image:"COLIFLOR_CAPEADA-2.jpeg"},
  {id:3, name:"Omelette de Papa con Espinaca", desc:"Omelette relleno de papa y espinaca, con arroz", price:16, image:"Omelette_de_papa_con_espinaca-3.jpeg"},
  {id:4, name:"Champiñón con Queso", desc:"Champiñones en salsa cremosa con queso derretido", price:17, image:"Champiñon_con_queso-4.jpeg"},
  {id:5, name:"Coliflor Capeada", desc:"Coliflor capeada en huevo, con arroz y frijol", price:16, image:"Coliflor_capeada-5.jpeg"},
  {id:6, name:"Chicharrón en Salsa Verde", desc:"Chicharrón guisado en salsa verde con arroz y frijol", price:19, image:"Chicharrón_verde-6.jpeg"},
  {id:7, name:"Mole Rojo", desc:"Carne en mole rojo tradicional, con arroz y frijol", price:20, image:"Mole_rojo-7.jpeg"},
  {id:8, name:"Soufflé de Papa", desc:"Papa en soufflé cremoso, con arroz y frijol", price:16, image:"soufle_de_papa-8.jpeg"},
  {id:9, name:"Longaniza en Salsa Verde", desc:"Longaniza guisada en salsa verde con arroz y frijol", price:18, image:"Longaniza_en_salsa_verde-9.jpeg"},
  {id:10, name:"Empanizado", desc:"Milanesa empanizada, con arroz y frijol", price:20, image:"Empanizado-10.jpeg"},
  {id:11, name:"Puerco con Verdolagas", desc:"Carne de puerco guisada con verdolagas en salsa verde", price:19, image:"Carne_de_puerco_con_Verdolaga-11.jpeg"},
  {id:12, name:"Patita Capeada", desc:"Patita de cerdo capeada en huevo, con arroz y frijol", price:18, image:"Patita_capeada-12.jpeg"},
  {id:13, name:"Chile Relleno", desc:"Chile relleno capeado, con arroz y frijol", price:19, image:"Chile_relleno-13.jpeg"},
  {id:14, name:"Chicharrón Prensado", desc:"Chicharrón prensado guisado en salsa roja", price:19, image:"Chicharrón_prensado-14.jpeg"},
  {id:15, name:"Mole Verde", desc:"Carne en mole verde tradicional, con arroz y frijol", price:20, image:"Mole_verde-15.jpeg"},
  {id:16, name:"Bistec en Chile Pasilla", desc:"Bistec de res guisado en chile pasilla", price:21, image:"BISTEC_EN_CHILE_PASILLA-16.jpeg"},
  {id:17, name:"Bistec a la Mexicana", desc:"Bistec de res guisado con jitomate, cebolla y chile", price:21, image:"BISTEC_A_LA_MEXICANA-17.jpeg"},
  {id:18, name:"Pollo a la Crema", desc:"Pollo guisado en salsa cremosa", price:19, image:"POLLO_A_LA_CREMA-18.jpeg"},
  {id:19, name:"Picadillo", desc:"Carne molida guisada con verduras", price:18, image:"PICADILLO-19.jpeg"},
  {id:20, name:"Rajas con Crema", desc:"Rajas poblanas en salsa cremosa", price:17, image:"RAJAS_CON_CREMA-20.jpeg"},
  {id:21, name:"Tinga de Res", desc:"Res deshebrada guisada en salsa de jitomate y chipotle", price:19, image:"TINGA_DE_RES-21.jpeg"},
  {id:22, name:"Tortita de Res en Salsa Verde", desc:"Tortita de res guisada en salsa verde", price:19, image:"TORTITA_DE_RES_EN_SALSA_VERDE-22.jpeg"},
  {id:23, name:"Costilla con Nopales", desc:"Costilla de cerdo guisada con nopales en salsa verde", price:22, image:"COSTILLA_CON_NOPALES-23.jpeg"},
  {id:24, name:"Papa con Chorizo", desc:"Papa guisada con chorizo", price:17, image:"PAPA_CON_CHORIZO-24.jpeg"},
  
];

const qty = {};
tacos.forEach(t => qty[t.id] = 0);
const menuEl = document.getElementById('menu');
const fmt = n => '$' + n.toLocaleString('es-MX');

function render(){
  menuEl.innerHTML = tacos.map(t => {
    const hasImg = t.image && t.image.trim() !== "";
    return `
      <div class="taco">
        <div class="photo-slot">
          ${hasImg ? `<img src="${t.image}" alt="${t.name}" onerror="this.style.display='none';">` : ''}
          <div class="photo-fallback">
            <span class="icon">🌮</span>
            <span>FOTO</span>
          </div>
        </div>
        <div class="taco-info">
          <h2>${t.name}</h2>
          <p>${t.desc}</p>
          <span class="price">${fmt(t.price)}</span>
        </div>
        <div class="stepper">
          <button aria-label="Quitar" data-id="${t.id}" data-action="minus">–</button>
          <span class="qty-count" id="qty-${t.id}">${qty[t.id]}</span>
          <button aria-label="Agregar" data-id="${t.id}" data-action="plus">+</button>
        </div>
      </div>
    `;
  }).join('');
}
render();

function updateSummary(){
  let count = 0, total = 0;
  tacos.forEach(t => { count += qty[t.id]; total += qty[t.id]*t.price; });
  document.getElementById('itemsLabel').textContent = count === 1 ? '1 taco' : `${count} tacos`;
  document.getElementById('totalLabel').textContent = fmt(total);
  const nombre = document.getElementById('nombre').value.trim();
  const btn = document.getElementById('orderBtn');
  const hint = document.getElementById('hintText');
  const ready = count > 0 && nombre.length > 0;
  btn.disabled = !ready;
  hint.textContent = ready ? 'Todo listo, te abrimos WhatsApp' : 'Agrega al menos un taco y escribe tu nombre';
}

menuEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if(!btn) return;
  const id = Number(btn.dataset.id);
  if(btn.dataset.action === 'plus') qty[id]++;
  else qty[id] = Math.max(0, qty[id]-1);
  document.getElementById(`qty-${id}`).textContent = qty[id];
  updateSummary();
});

document.getElementById('nombre').addEventListener('input', updateSummary);

document.getElementById('orderBtn').addEventListener('click', () => {
  const nombre = document.getElementById('nombre').value.trim();
  let total = 0;
  const lineas = tacos.filter(t => qty[t.id] > 0).map(t => {
    const sub = t.price * qty[t.id];
    total += sub;
    return `${qty[t.id]}x Taco de ${t.name} - ${fmt(sub)}`;
  });
  const mensaje = `Hola, soy ${nombre}.\nQuiero pedir:\n${lineas.join('\n')}\n\nTotal: ${fmt(total)}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');
});

if(location.hash === '#pedido'){
  window.addEventListener('load', () => document.getElementById('pedido').scrollIntoView());
}
updateSummary();
</script>

</body>
</html>
