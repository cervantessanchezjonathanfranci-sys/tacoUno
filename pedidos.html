<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guisados - Taco Uno+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --card:#1E1D1A; --card2:#262420; --line:#2E2C27;
    --chile:#E63946; --magenta:#E5177E; --teal:#00A9B4; --green:#7CB342;
    --cream:#F5EFE6; --muted:#A69C8C;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; padding-bottom:130px;}
  h1,h2,.price,.qty-count{font-family:'Baloo 2',sans-serif;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
  }
  .topbar a{
    color:var(--teal); text-decoration:none; font-size:.9rem; font-weight:600;
    border:1px solid var(--line); padding:8px 14px; border-radius:9px;
  }
  .topbar-brand{display:flex; align-items:center; gap:9px;}
  .topbar-brand img{width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--teal);}
  .topbar h1{font-size:1.2rem; margin:0; color:var(--magenta);}

  main{max-width:640px; margin:0 auto; padding:20px 16px;}

  .taco{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; display:flex; gap:14px; align-items:center;
  }
  .photo-slot{
    width:88px; height:88px; flex-shrink:0; border-radius:12px;
    border:2px dashed var(--teal); position:relative; overflow:hidden;
  }
  .photo-slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-fallback{
    display:none; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    width:100%; height:100%; color:var(--muted); font-size:.62rem; text-align:center; line-height:1.2;
  }
  .photo-fallback .icon{font-size:1.4rem;}

  .taco-info{flex:1; min-width:0;}
  .taco-info h2{font-size:1.1rem; margin:0 0 3px; font-weight:700;}
  .taco-info p{margin:0; color:var(--muted); font-size:.85rem; line-height:1.35;}
  .price{color:var(--magenta); font-weight:700; font-size:.92rem; margin-top:5px; display:block;}

  .card-actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0; align-items:stretch;}
  .add-btn{
    background:var(--chile); color:var(--cream); border:none; border-radius:9px;
    padding:8px 10px; font-size:.78rem; font-weight:700; font-family:'Baloo 2',sans-serif;
    cursor:pointer; white-space:nowrap;
  }
  .add-btn:active{background:#c92836;}
  .combo-toggle{
    background:var(--card2); color:var(--muted); border:1px solid var(--line); border-radius:9px;
    padding:7px 10px; font-size:.72rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .combo-toggle.active{background:var(--teal); color:#0D2224; border-color:var(--teal);}

  #comboBanner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card2); border:1px solid var(--teal); border-radius:12px;
    padding:12px 14px; margin-bottom:14px; font-size:.85rem;
  }
  #comboBanner strong{color:var(--teal);}
  #comboBanner .combo-actions{display:flex; gap:8px; flex-shrink:0;}
  #comboBanner button{
    border:none; border-radius:8px; padding:8px 12px; font-size:.8rem; font-weight:700;
    font-family:'Baloo 2',sans-serif; cursor:pointer;
  }
  #comboAddBtn{background:var(--teal); color:#0D2224;}
  #comboCancelBtn{background:transparent; color:var(--muted); border:1px solid var(--line);}

  .order-line{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .order-line:last-child{border-bottom:none;}
  .order-line-info{flex:1; min-width:0;}
  .order-line-info strong{display:block; font-size:.88rem;}
  .order-line-price{color:var(--magenta); font-size:.8rem; font-weight:700;}
  .order-line-toggles{display:flex; gap:6px; align-items:center; flex-shrink:0;}
  .chip{
    border:1px solid var(--line); background:var(--card2); color:var(--muted);
    border-radius:20px; padding:6px 10px; font-size:.72rem; font-weight:600; cursor:pointer;
  }
  .chip.active{background:var(--green); color:#16240B; border-color:var(--green);}
  .remove-btn{
    border:none; background:transparent; color:var(--muted); font-size:1rem; cursor:pointer; padding:4px 6px;
  }
  .empty-order{color:var(--muted); font-size:.85rem; margin:0 0 10px;}
  .section-hint{color:var(--muted); font-size:.82rem; margin:0 0 14px; line-height:1.4;}

  #pedido{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin:20px 0 12px; scroll-margin-top:20px;
  }
  #pedido h2{font-size:1.05rem; margin:0 0 10px;}
  #pedido label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:8px;}
  #pedido input{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--card2); color:var(--cream); font-size:1rem; font-family:inherit;
  }
  #pedido input:focus{outline:2px solid var(--corn); outline-offset:1px;}

  .bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .bar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:14px;}
  .bar-total{flex:1;}
  .bar-total span{display:block; color:var(--muted); font-size:.78rem;}
  .bar-total strong{font-size:1.35rem; color:var(--magenta);}
  .order-btn{
    background:var(--chile); color:var(--cream); border:none; border-radius:11px;
    padding:14px 20px; font-size:.98rem; font-weight:700; font-family:'Baloo 2',sans-serif;
    cursor:pointer; white-space:nowrap;
  }
  .order-btn:disabled{background:var(--card2); color:var(--muted); cursor:not-allowed;}
  .order-btn:not(:disabled):active{background:#c92836;}
  .hint{font-size:.76rem; color:var(--muted); text-align:center; margin-top:4px;}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#FBF8F2; --card:#FFFFFF; --card2:#F2EDE2; --line:#E4DCC9;
      --cream:#2A241C; --muted:#7A7062;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← Inicio</a>
  <div class="topbar-brand">
    <img src="logo.png" alt="Taco Uno+">
    <h1>Guisados</h1>
  </div>
  <span style="width:70px"></span>
</div>

<main>
  <div id="comboBanner">
    <span id="comboBannerText"></span>
    <div class="combo-actions">
      <button id="comboAddBtn">Combinar $75</button>
      <button id="comboCancelBtn">Cancelar</button>
    </div>
  </div>

  <p class="section-hint">En los guisados marcados con "Combinar" el cliente elige: pedirlo solo ($45) o combinarlo con otro de esos mismos guisados ($75 los dos).</p>
  <div id="menu"></div>

  <div id="pedido">
    <h2>Tu pedido</h2>
    <div id="orderLines"></div>
    <label for="nombre">Tu nombre</label>
    <input type="text" id="nombre" placeholder="¿Cómo te llamas?">
  </div>
</main>

<div class="bar">
  <div class="bar-inner">
    <div class="bar-total">
      <span id="itemsLabel">0 tacos</span>
      <strong id="totalLabel">$0</strong>
    </div>
    <button class="order-btn" id="orderBtn" disabled>Hacer Pedido</button>
  </div>
  <p class="hint" id="hintText">Agrega al menos un taco y escribe tu nombre</p>
</div>

<script>
const WHATSAPP_NUMBER = "529831023719";
const PRECIO_SENCILLO = 45;
const PRECIO_COMBO = 75;

const tacos = [
  {id:1, name:"Tortita de Camarón con Nopales", desc:"Tortita de camarón guisada con nopales", combinable:false},
  {id:2, name:"Coliflor Capeada", desc:"Coliflor capeada en huevo", combinable:false},
  {id:3, name:"Omelette de Papa con Espinaca", desc:"Omelette relleno de papa y espinaca", combinable:false},
  {id:4, name:"Champiñón con Queso", desc:"Champiñones en salsa cremosa con queso derretido", combinable:false},
  {id:5, name:"Coliflor Capeada", desc:"Coliflor capeada en huevo", combinable:false},
  {id:6, name:"Chicharrón en Salsa Verde", desc:"Chicharrón guisado en salsa verde", combinable:false},
  {id:7, name:"Mole Rojo", desc:"Carne en mole rojo tradicional", combinable:false},
  {id:8, name:"Soufflé de Papa", desc:"Papa en soufflé cremoso", combinable:false},
  {id:9, name:"Longaniza en Salsa Verde", desc:"Longaniza guisada en salsa verde", combinable:false},
  {id:10, name:"Empanizado", desc:"Milanesa empanizada", combinable:false},
  {id:11, name:"Puerco con Verdolagas", desc:"Carne de puerco guisada con verdolagas en salsa verde", combinable:false},
  {id:12, name:"Patita Capeada", desc:"Patita de cerdo capeada en huevo", combinable:false},
  {id:13, name:"Chile Relleno", desc:"Chile relleno capeado", combinable:false},
  {id:14, name:"Chicharrón Prensado", desc:"Chicharrón prensado guisado en salsa roja", combinable:false},
  {id:15, name:"Mole Verde", desc:"Carne en mole verde tradicional", combinable:false},
  {id:16, name:"Bistec en Chile Pasilla", desc:"Bistec de res guisado en chile pasilla", combinable:true},
  {id:17, name:"Bistec a la Mexicana", desc:"Bistec de res guisado con jitomate, cebolla y chile", combinable:true},
  {id:18, name:"Pollo a la Crema", desc:"Pollo guisado en salsa cremosa", combinable:true},
  {id:19, name:"Picadillo", desc:"Carne molida guisada con verduras", combinable:true},
  {id:20, name:"Rajas con Crema", desc:"Rajas poblanas en salsa cremosa", combinable:true},
  {id:21, name:"Tinga de Res", desc:"Res deshebrada guisada en salsa de jitomate y chipotle", combinable:true},
  {id:22, name:"Tortita de Res en Salsa Verde", desc:"Tortita de res guisada en salsa verde", combinable:true},
  {id:23, name:"Costilla con Nopales", desc:"Costilla de cerdo guisada con nopales en salsa verde", combinable:true},
  {id:24, name:"Papa con Chorizo", desc:"Papa guisada con chorizo", combinable:true},
  {id:25, name:"Guisado por definir", desc:"Aún nos falta el nombre y la foto de este guisado", combinable:false},
];

const menuEl = document.getElementById('menu');
const fmt = n => '$' + n.toLocaleString('es-MX');

let comboSelection = [];   // hasta 2 ids de tacos elegidos para combinar
let orders = [];           // pedidos ya agregados al carrito
let nextUid = 1;

function render(){
  menuEl.innerHTML = tacos.map(t => `
    <div class="taco">
      <div class="photo-slot">
        <img src="foto-${t.id}.jpg" alt="${t.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="photo-fallback">
          <span class="icon">🌮</span>
          <span>FOTO</span>
        </div>
      </div>
      <div class="taco-info">
        <h2>${t.name}</h2>
        <p>${t.desc}</p>
        <span class="price">Sencillo ${fmt(PRECIO_SENCILLO)}</span>
      </div>
      <div class="card-actions">
        <button class="add-btn" data-id="${t.id}" data-action="add-solo">${t.combinable ? 'Solo' : 'Agregar'} $${PRECIO_SENCILLO}</button>
        ${t.combinable ? `
        <button class="combo-toggle ${comboSelection.includes(t.id) ? 'active' : ''}" data-id="${t.id}" data-action="toggle-combo">
          ${comboSelection.includes(t.id) ? '✓ Para combinar' : 'Combinar'}
        </button>` : ''}
      </div>
    </div>
  `).join('');
  renderComboBanner();
}

function renderComboBanner(){
  const banner = document.getElementById('comboBanner');
  if(comboSelection.length === 2){
    const [a, b] = comboSelection.map(id => tacos.find(t => t.id === id));
    document.getElementById('comboBannerText').innerHTML = `<strong>${a.name}</strong> + <strong>${b.name}</strong>`;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

function addOrderLine(name, price){
  orders.push({uid: nextUid++, name, price, frijol:true, arroz:true});
  renderOrderLines();
  updateSummary();
}

function renderOrderLines(){
  const el = document.getElementById('orderLines');
  if(orders.length === 0){
    el.innerHTML = '<p class="empty-order">Aún no agregas nada. Elige tus guisados arriba.</p>';
    return;
  }
  el.innerHTML = orders.map(o => `
    <div class="order-line">
      <div class="order-line-info">
        <strong>${o.name}</strong>
        <span class="order-line-price">${fmt(o.price)}</span>
      </div>
      <div class="order-line-toggles">
        <button class="chip ${o.frijol ? 'active' : ''}" data-uid="${o.uid}" data-field="frijol">Frijol</button>
        <button class="chip ${o.arroz ? 'active' : ''}" data-uid="${o.uid}" data-field="arroz">Arroz</button>
        <button class="remove-btn" data-uid="${o.uid}" data-action="remove">✕</button>
      </div>
    </div>
  `).join('');
}

function updateSummary(){
  const total = orders.reduce((sum, o) => sum + o.price, 0);
  document.getElementById('itemsLabel').textContent = orders.length === 1 ? '1 platillo' : `${orders.length} platillos`;
  document.getElementById('totalLabel').textContent = fmt(total);
  const nombre = document.getElementById('nombre').value.trim();
  const btn = document.getElementById('orderBtn');
  const hint = document.getElementById('hintText');
  const ready = orders.length > 0 && nombre.length > 0;
  btn.disabled = !ready;
  hint.textContent = ready ? 'Todo listo, te abrimos WhatsApp' : 'Agrega al menos un platillo y escribe tu nombre';
}

menuEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if(!btn) return;
  const id = Number(btn.dataset.id);
  const taco = tacos.find(t => t.id === id);

  if(btn.dataset.action === 'add-solo'){
    addOrderLine(taco.name, PRECIO_SENCILLO);
  } else if(btn.dataset.action === 'toggle-combo'){
    if(comboSelection.includes(id)){
      comboSelection = comboSelection.filter(x => x !== id);
    } else if(comboSelection.length < 2){
      comboSelection.push(id);
    } else {
      comboSelection = [comboSelection[1], id];
    }
    render();
  }
});

document.getElementById('comboAddBtn').addEventListener('click', () => {
  const [a, b] = comboSelection.map(id => tacos.find(t => t.id === id));
  addOrderLine(`${a.name} + ${b.name}`, PRECIO_COMBO);
  comboSelection = [];
  render();
});

document.getElementById('comboCancelBtn').addEventListener('click', () => {
  comboSelection = [];
  render();
});

document.getElementById('orderLines').addEventListener('click', e => {
  const btn = e.target.closest('button[data-uid]');
  if(!btn) return;
  const uid = Number(btn.dataset.uid);
  const order = orders.find(o => o.uid === uid);
  if(btn.dataset.action === 'remove'){
    orders = orders.filter(o => o.uid !== uid);
  } else if(btn.dataset.field === 'frijol'){
    order.frijol = !order.frijol;
  } else if(btn.dataset.field === 'arroz'){
    order.arroz = !order.arroz;
  }
  renderOrderLines();
  updateSummary();
});

document.getElementById('nombre').addEventListener('input', updateSummary);

document.getElementById('orderBtn').addEventListener('click', () => {
  const nombre = document.getElementById('nombre').value.trim();
  const total = orders.reduce((sum, o) => sum + o.price, 0);
  const lineas = orders.map(o => {
    const extras = `${o.frijol ? 'con frijol' : 'sin frijol'}, ${o.arroz ? 'con arroz' : 'sin arroz'}`;
    return `${o.name} (${extras}) - ${fmt(o.price)}`;
  });
  const mensaje = `Hola, soy ${nombre}.\nQuiero pedir:\n${lineas.join('\n')}\n\nTotal: ${fmt(total)}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');
});

if(location.hash === '#pedido'){
  window.addEventListener('load', () => document.getElementById('pedido').scrollIntoView());
}

render();
renderOrderLines();
updateSummary();
</script>

</body>
</html>
