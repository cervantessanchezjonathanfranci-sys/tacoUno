<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guisados - Taco Uno+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212; --card:#1E1D1A; --card2:#262420; --line:#2E2C27;
    --chile:#E63946; --magenta:#E5177E; --teal:#00A9B4; --green:#7CB342;
    --cream:#F5EFE6; --muted:#A69C8C;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; padding-bottom:140px;}
  h1,h2,.price,.qty-count{font-family:'Baloo 2',sans-serif;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:1px solid var(--line);
  }
  .topbar a{
    color:var(--teal); text-decoration:none; font-size:.9rem; font-weight:600;
    border:1px solid var(--line); padding:8px 14px; border-radius:9px;
  }
  .topbar-brand{display:flex; align-items:center; gap:9px;}
  .topbar-brand img{width:34px; height:34px; border-radius:50%; background:#fff; border:1px solid var(--teal);}
  .topbar h1{font-size:1.2rem; margin:0; color:var(--magenta);}

  main{max-width:640px; margin:0 auto; padding:20px 16px;}

  .taco{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:14px; display:flex; flex-direction:column; gap:12px;
  }
  .taco-main{display:flex; gap:14px; align-items:center;}
  
  .photo-slot{
    width:84px; height:84px; flex-shrink:0; border-radius:12px;
    border:2px dashed var(--teal); position:relative; overflow:hidden;
  }
  .photo-slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-fallback{
    display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center;
    width:100%; height:100%; color:var(--muted); font-size:.62rem; text-align:center; line-height:1.2;
  }
  .photo-fallback .icon{font-size:1.4rem;}

  .taco-info{flex:1; min-width:0;}
  .taco-info h2{font-size:1.1rem; margin:0 0 3px; font-weight:700;}
  .taco-info p{margin:0; color:var(--muted); font-size:.85rem; line-height:1.35;}
  .price{color:var(--magenta); font-weight:700; font-size:.95rem; margin-top:4px; display:block;}

  .stepper{display:flex; align-items:center; gap:9px; flex-shrink:0;}
  .stepper button{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background:var(--card2); color:var(--cream); font-size:1.15rem; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .stepper button:active{background:var(--chile); border-color:var(--chile);}
  .qty-count{min-width:16px; text-align:center; font-weight:700;}

  /* Opciones de personalización */
  .taco-options{
    background:var(--card2); border-radius:10px; padding:10px 12px;
    border:1px solid var(--line); display:flex; flex-direction:column; gap:8px; font-size:.85rem;
  }
  .options-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .options-row label{display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none;}
  .options-row input[type="checkbox"]{accent-color:var(--teal); width:16px; height:16px;}
  
  .combo-select-wrap{margin-top:2px; display:flex; flex-direction:column; gap:4px;}
  .combo-select-wrap select{
    width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--cream); font-family:inherit; font-size:.85rem;
  }
  .combo-select-wrap select:focus{outline:2px solid var(--teal);}

  #pedido{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin:20px 0 12px; scroll-margin-top:20px;
  }
  #pedido h2{font-size:1.05rem; margin:0 0 10px;}
  #pedido label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:8px;}
  #pedido input{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--card2); color:var(--cream); font-size:1rem; font-family:inherit;
  }
  #pedido input:focus{outline:2px solid var(--teal); outline-offset:1px;}

  .bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .bar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:14px;}
  .bar-total{flex:1;}
  .bar-total span{display:block; color:var(--muted); font-size:.78rem;}
  .bar-total strong{font-size:1.35rem; color:var(--magenta);}
  .order-btn{
    background:var(--chile); color:var(--cream); border:none; border-radius:11px;
    padding:14px 20px; font-size:.98rem; font-weight:700; font-family:'Baloo 2',sans-serif;
    cursor:pointer; white-space:nowrap;
  }
  .order-btn:disabled{background:var(--card2); color:var(--muted); cursor:not-allowed;}
  .order-btn:not(:disabled):active{background:#c92836;}
  .hint{font-size:.76rem; color:var(--muted); text-align:center; margin-top:4px;}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#FBF8F2; --card:#FFFFFF; --card2:#F2EDE2; --line:#E4DCC9;
      --cream:#2A241C; --muted:#7A7062;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← Inicio</a>
  <div class="topbar-brand">
    <img src="logo.png" alt="Taco Uno+" onerror="this.style.display='none';">
    <h1>Guisados</h1>
  </div>
  <span style="width:70px"></span>
</div>

<main>
  <div id="menu"></div>

  <div id="pedido">
    <h2>Tu pedido</h2>
    <label for="nombre">Tu nombre</label>
    <input type="text" id="nombre" placeholder="¿Cómo te llamas?">
  </div>
</main>

<div class="bar">
  <div class="bar-inner">
    <div class="bar-total">
      <span id="itemsLabel">0 tacos</span>
      <strong id="totalLabel">$0</strong>
    </div>
    <button class="order-btn" id="orderBtn" disabled>Hacer Pedido</button>
  </div>
  <p class="hint" id="hintText">Agrega al menos un taco y escribe tu nombre</p>
</div>

<script>
const WHATSAPP_NUMBER = "529831012379";

const BASE_PRICE = 45;
const COMBO_PRICE = 75;

const tacos = [
  {id:1, name:"Tortita de Camarón con Nopales", desc:"Tortita de camarón guisada con nopales", image:"TORTITA_DE_CAMARON_CON_NOPALES-1.jpeg"},
  {id:2, name:"Coliflor Capeada", desc:"Coliflor capeada en huevo", image:"COLIFLOR_CAPEADA-2.jpeg"},
  {id:3, name:"Omelette de Papa con Espinaca", desc:"Omelette relleno de papa y espinaca", image:"Omelette_de_papa_con_espinaca-3.jpeg"},
  {id:4, name:"Champiñón con Queso", desc:"Champiñones en salsa cremosa con queso derretido", image:"Champiñon_con_queso-4.jpeg"},
  {id:5, name:"Huevo en Chile de Árbol", desc:"Huevo guisado en salsa de chile de árbol", image:"Huevo_en_chile_de_arbol.jpeg"},
  {id:6, name:"Chicharrón en Salsa Verde", desc:"Chicharrón guisado en salsa verde", image:"Chicharrón_verde-6.jpeg"},
  {id:7, name:"Mole Rojo", desc:"Carne en mole rojo tradicional", image:"Mole_rojo-7.jpeg"},
  {id:8, name:"Soufflé de Papa", desc:"Papa en soufflé cremoso", image:"Souffle_de_papa-8.jpeg"},
  {id:9, name:"Longaniza en Salsa Verde", desc:"Longaniza guisada en salsa verde", image:"Longaniza_en_salsa_verde-9.jpeg"},
  {id:10, name:"Empanizado", desc:"Milanesa empanizada", image:"Empanizado-10.jpeg"},
  {id:11, name:"Puerco con Verdolagas", desc:"Carne de puerco guisada con verdolagas en salsa verde", image:"Carne_de_puerco_con_Verdolaga-11.jpeg"},
  {id:12, name:"Patita Capeada", desc:"Patita de cerdo capeada en huevo", image:"Patita_capeada-12.jpeg"},
  {id:13, name:"Chile Relleno", desc:"Chile relleno capeado", image:"Chile_relleno-13.jpeg"},
  {id:14, name:"Chicharrón Prensado", desc:"Chicharrón prensado guisado en salsa roja", image:"Chicharrón_prensado-14.jpeg"},
  {id:15, name:"Mole Verde", desc:"Carne en mole verde tradicional", image:"Mole_verde-15.jpeg"},
  {id:16, name:"Bistec en Chile Pasilla", desc:"Bistec de res guisado en chile pasilla", image:"BISTEC_EN_CHILE_PASILLA-16.jpeg"},
  {id:17, name:"Bistec a la Mexicana", desc:"Bistec de res guisado con jitomate, cebolla y chile", image:"BISTEC_A_LA_MEXICANA-17.jpeg"},
  {id:18, name:"Pollo a la Crema", desc:"Pollo guisado en salsa cremosa", image:"POLLO_A_LA_CREMA-18.jpeg"},
  {id:19, name:"Picadillo", desc:"Carne molida guisada con verduras", image:"PICADILLO-19.jpeg"},
  {id:20, name:"Rajas con Crema", desc:"Rajas poblanas en salsa cremosa", image:"RAJAS_CON_CREMA-20.jpeg"},
  {id:21, name:"Tinga de Res", desc:"Res deshebrada guisada en salsa de jitomate y chipotle", image:"TINGA_DE_RES-21.jpeg"},
  {id:22, name:"Tortita de Res en Salsa Verde", desc:"Tortita de res guisada en salsa verde", image:"TORTITA_DE_RES_EN_SALSA_VERDE-22.jpeg"},
  {id:23, name:"Costilla con Nopales", desc:"Costilla de cerdo guisada con nopales en salsa verde", image:"COSTILLA_CON_NOPALES-23.jpeg"},
  {id:24, name:"Papa con Chorizo", desc:"Papa guisada con chorizo", image:"PAPA_CON_CHORIZO-24.jpeg"}
];

const state = {};
tacos.forEach(t => {
  state[t.id] = {
    qty: 0,
    arroz: true,
    frijol: true,
    isCombo: false,
    secondGuisado: tacos.find(other => other.id !== t.id)?.name || ""
  };
});

const menuEl = document.getElementById('menu');
const fmt = n => '$' + n.toLocaleString('es-MX');

function render(){
  menuEl.innerHTML = tacos.map(t => {
    const hasImg = t.image && t.image.trim() !== "";
    const st = state[t.id];
    const itemPrice = st.isCombo ? COMBO_PRICE : BASE_PRICE;

    const otherOptions = tacos
      .filter(o => o.id !== t.id)
      .map(o => `<option value="${o.name}" ${st.secondGuisado === o.name ? 'selected' : ''}>${o.name}</option>`)
      .join('');

    return `
      <div class="taco" id="taco-card-${t.id}">
        <div class="taco-main">
          <div class="photo-slot">
            ${hasImg ? `<img src="${t.image}" alt="${t.name}" onerror="this.style.display='none';">` : ''}
            <div class="photo-fallback">
              <span class="icon">🌮</span>
              <span>FOTO</span>
            </div>
          </div>
          <div class="taco-info">
            <h2>${t.name}</h2>
            <p>${t.desc}</p>
            <span class="price" id="price-${t.id}">${fmt(itemPrice)} ${st.isCombo ? '(Combinado)' : ''}</span>
          </div>
          <div class="stepper">
            <button aria-label="Quitar" data-id="${t.id}" data-action="minus">–</button>
            <span class="qty-count" id="qty-${t.id}">${st.qty}</span>
            <button aria-label="Agregar" data-id="${t.id}" data-action="plus">+</button>
          </div>
        </div>

        <div class="taco-options">
          <div class="options-row">
            <label><input type="checkbox" data-id="${t.id}" data-opt="arroz" ${st.arroz ? 'checked' : ''}> Arroz</label>
            <label><input type="checkbox" data-id="${t.id}" data-opt="frijol" ${st.frijol ? 'checked' : ''}> Frijol</label>
            <label><input type="checkbox" data-id="${t.id}" data-opt="combo" ${st.isCombo ? 'checked' : ''}> Combinar (+ $30)</label>
          </div>

          <div class="combo-select-wrap" id="combo-wrap-${t.id}" style="display: ${st.isCombo ? 'flex' : 'none'};">
            <label style="color:var(--muted); font-size:.78rem;">Segundo guisado:</label>
            <select data-id="${t.id}" data-opt="secondSelect">
              ${otherOptions}
            </select>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

render();

function updateSummary(){
  let count = 0, total = 0;
  tacos.forEach(t => {
    const st = state[t.id];
    count += st.qty;
    const price = st.isCombo ? COMBO_PRICE : BASE_PRICE;
    total += st.qty * price;
  });

  document.getElementById('itemsLabel').textContent = count === 1 ? '1 taco' : `${count} tacos`;
  document.getElementById('totalLabel').textContent = fmt(total);

  const nombre = document.getElementById('nombre').value.trim();
  const btn = document.getElementById('orderBtn');
  const hint = document.getElementById('hintText');
  const ready = count > 0 && nombre.length > 0;
  btn.disabled = !ready;
  hint.textContent = ready ? 'Todo listo, te abrimos WhatsApp' : 'Agrega al menos un taco y escribe tu nombre';
}

menuEl.addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if(!btn) return;
  const id = Number(btn.dataset.id);
  if(btn.dataset.action === 'plus') state[id].qty++;
  else state[id].qty = Math.max(0, state[id].qty - 1);
  document.getElementById(`qty-${id}`).textContent = state[id].qty;
  updateSummary();
});

menuEl.addEventListener('change', e => {
  const target = e.target;
  const id = Number(target.dataset.id);
  if(!id || !state[id]) return;

  const opt = target.dataset.opt;
  if(opt === 'arroz') state[id].arroz = target.checked;
  if(opt === 'frijol') state[id].frijol = target.checked;
  if(opt === 'combo') {
    state[id].isCombo = target.checked;
    document.getElementById(`combo-wrap-${id}`).style.display = target.checked ? 'flex' : 'none';
    const priceEl = document.getElementById(`price-${id}`);
    const itemPrice = target.checked ? COMBO_PRICE : BASE_PRICE;
    priceEl.textContent = `${fmt(itemPrice)} ${target.checked ? '(Combinado)' : ''}`;
  }
  if(opt === 'secondSelect') {
    state[id].secondGuisado = target.value;
  }
  updateSummary();
});

document.getElementById('nombre').addEventListener('input', updateSummary);

document.getElementById('orderBtn').addEventListener('click', () => {
  const nombre = document.getElementById('nombre').value.trim();
  let total = 0;

  const lineas = tacos.filter(t => state[t.id].qty > 0).map(t => {
    const st = state[t.id];
    const itemPrice = st.isCombo ? COMBO_PRICE : BASE_PRICE;
    const subtotal = itemPrice * st.qty;
    total += subtotal;

    let guisadoTexto = t.name;
    if(st.isCombo && st.secondGuisado) {
      guisadoTexto += ` + ${st.secondGuisado}`;
    }

    const comps = [];
    if(st.arroz) comps.push("Arroz");
    if(st.frijol) comps.push("Frijol");
    const compTexto = comps.length > 0 ? ` (Con ${comps.join(" y ")})` : " (Sin arroz ni frijol)";

    const tacoLabel = st.qty === 1 ? 'taco' : 'tacos';
    return `• ${st.qty} ${tacoLabel} de ${guisadoTexto}${compTexto} - ${fmt(subtotal)}`;
  });

  const mensaje = `*Pedido de:* ${nombre}\n\n*Detalle del pedido:*\n${lineas.join('\n')}\n\n*Total a pagar:* ${fmt(total)}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');
});

if(location.hash === '#pedido'){
  window.addEventListener('load', () => document.getElementById('pedido').scrollIntoView());
}
updateSummary();
</script>

</body>
</html>
